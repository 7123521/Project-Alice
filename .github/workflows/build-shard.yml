name: Build (sharded)

# GitHub gives four cores per standard runner, and this project needs roughly 2200 CPU
# seconds to compile its 137 translation units, so a single job cannot go below ~9 minutes.
# Public repositories have unlimited minutes, so the work is spread over a matrix of jobs
# instead: each shard compiles a disjoint quarter of the object files and publishes them
# through the cache, and a final job restores all four and runs the link command directly.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CCACHE_DIR: /root/.cache/ccache
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 3G
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime

jobs:
  shard:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: compile shard ${{ matrix.shard }}
    steps:
    - name: Bootstrap git
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install toolchain
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ca-certificates git build-essential cmake ninja-build ccache clang lld \
          libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libicu-dev zlib1g-dev libluajit-5.1-dev file zstd

    - name: Restore fetched dependencies
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: deps-${{ hashFiles('CMakeLists.txt', 'dependencies/**') }}
        restore-keys: |
          deps-

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: /root/.cache/ccache
        key: ccache-${{ github.sha }}
        restore-keys: |
          ccache-

    - name: Configure
      run: |
        cmake -G Ninja -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Compile this shard
      shell: bash
      run: |
        set -o pipefail
        ninja -C build -t targets all \
          | grep -oE '^CMakeFiles/AliceIncremental\.dir/[^:]*\.o' | sort -u > /tmp/all_objs.txt
        total=$(wc -l < /tmp/all_objs.txt)
        awk -v s=${{ matrix.shard }} -v n=4 'NR % n == s' /tmp/all_objs.txt > /tmp/shard.txt
        echo "objects total=$total, this shard=$(wc -l < /tmp/shard.txt)"
        # the precompiled header has to exist before any unit can be compiled
        ninja -C build CMakeFiles/AliceIncremental.dir/cmake_pch.hxx.pch 2>/dev/null || true
        time ninja -C build $(cat /tmp/shard.txt)

    - name: Save this shard's objects
      uses: actions/cache@v4
      with:
        path: build/CMakeFiles
        key: objs-${{ github.sha }}-${{ matrix.shard }}

  link:
    needs: shard
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    name: link and publish
    steps:
    - name: Bootstrap git
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install toolchain
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ca-certificates git build-essential cmake ninja-build ccache clang lld \
          libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libicu-dev zlib1g-dev libluajit-5.1-dev file zstd

    - name: Restore fetched dependencies
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: deps-${{ hashFiles('CMakeLists.txt', 'dependencies/**') }}
        restore-keys: |
          deps-

    - name: Configure
      run: |
        cmake -G Ninja -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++

    - name: Restore shard 0 objects
      uses: actions/cache/restore@v4
      with:
        path: build/CMakeFiles
        key: objs-${{ github.sha }}-0
    - name: Restore shard 1 objects
      uses: actions/cache/restore@v4
      with:
        path: build/CMakeFiles
        key: objs-${{ github.sha }}-1
    - name: Restore shard 2 objects
      uses: actions/cache/restore@v4
      with:
        path: build/CMakeFiles
        key: objs-${{ github.sha }}-2
    - name: Restore shard 3 objects
      uses: actions/cache/restore@v4
      with:
        path: build/CMakeFiles
        key: objs-${{ github.sha }}-3

    - name: Link directly from the restored objects
      shell: bash
      run: |
        set -o pipefail
        missing=$(find build/CMakeFiles/AliceIncremental.dir -name '*.o' | wc -l)
        echo "objects present: $missing"
        LINK=$(ninja -C build -t commands AliceIncremental | tail -1)
        echo "${LINK:0:200} ..."
        cd build && eval "$LINK"

    - name: Verify binary
      run: |
        set -o pipefail
        file build/AliceIncremental
        if ldd build/AliceIncremental | grep "not found"; then
          echo "ERROR: unresolved shared libraries" >&2; exit 1
        fi
        echo "all shared libraries resolve"

    - name: Strip and compress
      run: |
        strip --strip-unneeded build/AliceIncremental || true
        zstd -19 -T0 -q -f build/AliceIncremental -o build/AliceIncremental.zst
        ls -la build/AliceIncremental build/AliceIncremental.zst
