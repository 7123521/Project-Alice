name: Build

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    # Build inside the target distro so the artifact actually runs on a Debian 13 host:
    # ICU and friends are soname-versioned, and a binary linked against Ubuntu's ICU 74
    # dies with "libicuuc.so.74: cannot open shared object file" on a trixie machine.
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    name: Debian trixie (Release)

    env:
      CCACHE_LOGFILE: /tmp/ccache.log
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime

    steps:
    - name: Bootstrap git (actions/checkout needs it to create a real repository)
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install toolchain
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ca-certificates git build-essential cmake ninja-build ccache clang lld \
          libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libicu-dev zlib1g-dev libluajit-5.1-dev file zstd
        clang++ --version | head -1
        cmake --version | head -1
        ninja --version

    # Cache only the fetched dependency trees. Configure refetches and rebuilds tbb, glm,
    # harfbuzz, freetype and friends otherwise, which costs about 50 s per run. Compiled
    # objects are NOT cached here: the build directory carries CMake metadata whose
    # timestamps ninja trusts, and restoring it made ninja rebuild everything anyway.
    # ccache handles object reuse, now that pch sloppiness makes all 137 units cacheable.
    - name: Restore fetched dependencies
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: deps-${{ hashFiles('CMakeLists.txt', 'dependencies/**') }}
        restore-keys: |
          deps-

    - name: Mark the workspace a git safe directory
      shell: bash
      run: |
        cd "${GITHUB_WORKSPACE:-$PWD}"
        git config --global --add safe.directory "$(pwd)"
        mkdir -p build

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        variant: ccache
        key: trixie-clang-release
        max-size: 2G

    - name: Configure
      run: |
        set -o pipefail
        cmake -G Ninja -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          2>&1 | tee build/configure.log

    - name: Build headless (AliceIncremental)
      run: |
        set -o pipefail
        cmake --build build --parallel --target AliceIncremental 2>&1 | tee build/build.log | tail -5

    - name: Build GUI client (manual dispatch only)
      if: github.event_name == 'workflow_dispatch'
      run: cmake --build build --parallel --target Alice

    - name: Verify binary
      run: |
        set -o pipefail
        file build/AliceIncremental
        if ldd build/AliceIncremental | grep "not found"; then
          echo "ERROR: unresolved shared libraries" >&2
          exit 1
        fi
        echo "all shared libraries resolve"

    - name: Collect report
      if: always()
      run: |
        {
          echo "commit: ${{ github.sha }}"
          echo "event: ${{ github.event_name }}"
          echo "cached build base: $(cat build/.cached_sha 2>/dev/null || echo none)"
          echo
          echo "== cpu =="; nproc
          echo "== memory =="; free -h | head -2
          echo
          echo "== ccache =="; ccache --show-stats || true
          echo
          echo "== ccache decisions =="
          CCACHE_LOGFILE=/tmp/ccache.log ccache --show-log-stats 2>&1 | tail -20 || true
          echo
          echo "== rebuild count (how many objects ninja rebuilt) =="
          grep -c 'Building CXX' build/build.log 2>/dev/null || echo 0
          echo
          echo "== binary =="; ls -la build/AliceIncremental 2>/dev/null || true
          echo
          echo "== configure tail =="; tail -15 build/configure.log 2>/dev/null || true
        } > build/ci-report.txt
        cat build/ci-report.txt

    - name: Strip and compress
      if: success()
      run: |
        for b in AliceIncremental Alice; do
          [ -f "build/$b" ] || continue
          strip --strip-unneeded "build/$b" || true
          zstd -19 -T0 -q -f "build/$b" -o "build/$b.zst"
        done
        ls -la build/Alice* || true

    - name: Publish dev build
      if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: dev-latest
        name: dev build (debian trixie)
        prerelease: true
        body: |
          Rolling Linux build @ ${{ github.sha }}, compiled inside debian:trixie so it matches
          a Debian 13 host. Alice = GUI client, AliceIncremental = headless.
          .zst variants are ~10 MB; decompress with: zstd -d file.zst
        files: |
          build/AliceIncremental
          build/AliceIncremental.zst
          build/Alice
          build/Alice.zst
          build/ci-report.txt
        fail_on_unmatched_files: false

  build-check:
    needs: [linux-build]
    runs-on: ubuntu-latest
    name: Build Matrix
    steps:
      - run: echo success
