name: Build Matrix

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: write

jobs:
  linux-build:
    strategy:
      matrix:
        config: [Release]
        llvm-version: [20]
        compiler: [clang]
        os: [ubuntu-latest]

    env:
      CC: clang-${{ matrix.llvm-version }}
      CXX: clang++-${{ matrix.llvm-version }}

    name: Ubuntu with ${{ matrix.compiler }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Apt LLVM
      run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm-version }}
          sudo apt-get update

    - name: install Clang
      run: sudo apt install --no-install-recommends clang-${{ matrix.llvm-version }}

    - name: "Install"
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: git build-essential cmake libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libicu-dev
        version: 1.0

    - name: Configure Build Files
      run: |
        cmake -DCMAKE_BUILD_TYPE=${{ matrix.config }} -B build

    - name: Build Project Alice
      run: |
        cmake --build build --parallel --target Alice

    - name: Build Project Alice Incremental
      run: |
        cmake --build build --parallel --target AliceIncremental

    - name: Smoke test (headless, 1 year)
      run: |
        ls -la build/AliceIncremental
        ./build/AliceIncremental --headless -years 1 -dump /tmp/smoke -seed 1234 -threads 2 | tail -3

    - name: Publish dev build (anonymous download)
      if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        # one rolling pre-release, overwritten on every build, so tags do not accumulate
        tag_name: dev-latest
        name: dev build (latest main)
        prerelease: true
        body: |
          Rolling Linux build of branch main @ ${{ github.sha }}
          Alice = full client, AliceIncremental = headless (for -dump experiments)
          This is a fork-local development build, not an upstream release.
        files: |
          build/AliceIncremental
          build/Alice
        fail_on_unmatched_files: true

    - name: Upload Linux binaries
      uses: actions/upload-artifact@v4
      with:
        name: alice-linux-${{ github.sha }}
        path: |
          build/AliceIncremental
          build/Alice
        if-no-files-found: error
        retention-days: 30

  build-check:
    needs: [linux-build]
    runs-on: ubuntu-latest
    name: Build Matrix
    steps:
      - name: Check
        run: |
          echo success
