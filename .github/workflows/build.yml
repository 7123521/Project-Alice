name: Build

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    # Build inside the target distro so the artifact actually runs on a Debian 13 host:
    # ICU and friends are soname-versioned, and a binary linked against Ubuntu's ICU 74
    # dies with "libicuuc.so.74: cannot open shared object file" on a trixie machine.
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    name: Debian trixie (Release)

    env:
      CCACHE_LOGFILE: /tmp/ccache.log
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install toolchain
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ca-certificates git build-essential cmake ninja-build ccache clang lld \
          libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libicu-dev zlib1g-dev libluajit-5.1-dev file zstd
        clang++ --version | head -1
        cmake --version | head -1
        ninja --version

    # Cache the whole build tree, not just ccache: the precompiled header makes roughly
    # half of the translation units uncacheable for ccache, so a ccache-only strategy
    # rebuilt 134 of 261 units on every run. Restoring the object files and then pinning
    # source timestamps to before the cached objects makes ninja rebuild only what the
    # commits since the cached revision actually touched, which is what a local
    # incremental build does.
    - name: Restore build tree
      uses: actions/cache@v4
      with:
        path: build
        key: buildtree-${{ github.run_id }}
        restore-keys: |
          buildtree-

    - name: Pin source timestamps to the cached build
      shell: bash
      run: |
        set -eu
        cd "${GITHUB_WORKSPACE:-$PWD}"
        echo "cwd=$(pwd)"
        mkdir -p build
        if [ -f build/.cached_sha ]; then
          BASE=$(cat build/.cached_sha)
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "cached build is from ${BASE}"
            # 1. everything looks old, so unchanged files are older than the cached objects
            find src dependencies -type f -exec touch -d '2020-01-01 00:00:00' {} + 2>/dev/null || true
            touch -d '2020-01-01 00:00:00' CMakeLists.txt 2>/dev/null || true
            # 2. files actually changed since then look new, so ninja rebuilds exactly those
            git diff --name-only "${BASE}" HEAD -- src dependencies CMakeLists.txt \
              | tr '\n' '\0' | xargs -0 -r touch
            echo "changed files: $(git diff --name-only "${BASE}" HEAD -- src dependencies CMakeLists.txt | wc -l)"
          else
            echo "cached revision ${BASE} not in history, doing a full build"
          fi
        else
          echo "no cached build tree, doing a full build"
        fi
        git rev-parse HEAD > build/.cached_sha

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        variant: ccache
        key: trixie-clang-release
        max-size: 2G

    - name: Configure
      run: |
        set -o pipefail
        cmake -G Ninja -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          2>&1 | tee build/configure.log

    - name: Build headless (AliceIncremental)
      run: |
        set -o pipefail
        cmake --build build --parallel --target AliceIncremental 2>&1 | tee build/build.log | tail -5

    - name: Build GUI client (manual dispatch only)
      if: github.event_name == 'workflow_dispatch'
      run: cmake --build build --parallel --target Alice

    - name: Verify binary
      run: |
        set -o pipefail
        file build/AliceIncremental
        if ldd build/AliceIncremental | grep "not found"; then
          echo "ERROR: unresolved shared libraries" >&2
          exit 1
        fi
        echo "all shared libraries resolve"

    - name: Collect report
      if: always()
      run: |
        {
          echo "commit: ${{ github.sha }}"
          echo "event: ${{ github.event_name }}"
          echo "cached build base: $(cat build/.cached_sha 2>/dev/null || echo none)"
          echo
          echo "== cpu =="; nproc
          echo "== memory =="; free -h | head -2
          echo
          echo "== ccache =="; ccache --show-stats || true
          echo
          echo "== ccache decisions =="
          CCACHE_LOGFILE=/tmp/ccache.log ccache --show-log-stats 2>&1 | tail -20 || true
          echo
          echo "== rebuild count (how many objects ninja rebuilt) =="
          grep -c 'Building CXX' build/build.log 2>/dev/null || echo 0
          echo
          echo "== binary =="; ls -la build/AliceIncremental 2>/dev/null || true
          echo
          echo "== configure tail =="; tail -15 build/configure.log 2>/dev/null || true
        } > build/ci-report.txt
        cat build/ci-report.txt

    - name: Strip and compress
      if: success()
      run: |
        for b in AliceIncremental Alice; do
          [ -f "build/$b" ] || continue
          strip --strip-unneeded "build/$b" || true
          zstd -19 -T0 -q -f "build/$b" -o "build/$b.zst"
        done
        ls -la build/Alice* || true

    - name: Publish dev build
      if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: dev-latest
        name: dev build (debian trixie)
        prerelease: true
        body: |
          Rolling Linux build @ ${{ github.sha }}, compiled inside debian:trixie so it matches
          a Debian 13 host. Alice = GUI client, AliceIncremental = headless.
          .zst variants are ~10 MB; decompress with: zstd -d file.zst
        files: |
          build/AliceIncremental
          build/AliceIncremental.zst
          build/Alice
          build/Alice.zst
          build/ci-report.txt
        fail_on_unmatched_files: false

  build-check:
    needs: [linux-build]
    runs-on: ubuntu-latest
    name: Build Matrix
    steps:
      - run: echo success
