name: Build

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    # Build inside the same distro/ABI as the target machine (Debian 13 trixie), so the produced
    # binary actually runs there: ICU ships soname-versioned libraries (libicuuc.so.76), and a
    # binary linked against Ubuntu 24.04's ICU 74 fails to start with "cannot open shared object".
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    name: Debian trixie (Release)

    env:
      CCACHE_LOGFILE: /tmp/ccache.log
      CCACHE_DEBUG: ""

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install toolchain
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ca-certificates git build-essential cmake ninja-build ccache clang lld \
          libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libicu-dev zlib1g-dev libluajit-5.1-dev file
        echo "=== toolchain ==="
        clang++ --version | head -2
        cmake --version | head -1
        ninja --version
        ccache --version | head -1

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        variant: ccache
        key: trixie-clang-release
        max-size: 2G

    - name: Configure
      run: |
        set -o pipefail
        mkdir -p build
        cmake -G Ninja -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          2>&1 | tee build/configure.log

    - name: Build headless (AliceIncremental)
      run: cmake --build build --parallel --target AliceIncremental

    - name: Build GUI client (manual dispatch only)
      if: github.event_name == 'workflow_dispatch'
      run: cmake --build build --parallel --target Alice

    - name: Verify binary
      run: |
        set -o pipefail
        file build/AliceIncremental
        if ldd build/AliceIncremental | grep "not found"; then
          echo "ERROR: unresolved shared libraries" >&2
          exit 1
        fi
        echo "all shared libraries resolve"

    - name: Collect report
      if: always()
      run: |
        {
          echo "commit: ${{ github.sha }}"
          echo "event: ${{ github.event_name }}"
          echo "base image: debian:trixie"
          echo
          echo "== cpu =="; nproc; lscpu | grep -E 'Model name|^CPU\(s\):|Thread|^Core' || true
          echo "== memory =="; free -h
          echo
          echo "== ccache =="; ccache --show-stats || true
          echo
          echo "== ccache uncacheable reasons =="; ccache --show-log-stats 2>&1 | tail -30 || true
          echo
          echo "== binary =="; ls -la build/AliceIncremental 2>/dev/null || true
          echo
          echo "== configure log tail =="; tail -60 build/configure.log 2>/dev/null || echo "(no configure log)"
          echo
          echo "== cmake configure log =="; tail -60 build/CMakeFiles/CMakeConfigureLog.yaml 2>/dev/null || echo "(none)" 
          echo "== ldd =="; ldd build/AliceIncremental || true
        } > build/ci-report.txt
        cat build/ci-report.txt

    - name: Strip and compress
      if: success()
      run: |
        for b in AliceIncremental Alice; do
          [ -f "build/$b" ] || continue
          strip --strip-unneeded "build/$b" || true
          zstd -19 -T0 -q -f "build/$b" -o "build/$b.zst"
        done
        ls -la build/Alice* || true

    - name: Publish dev build
      if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: dev-latest
        name: dev build (debian trixie)
        prerelease: true
        body: |
          Rolling Linux build @ ${{ github.sha }}, compiled inside debian:trixie so the binary
          matches a Debian 13 host (ICU 76). Alice = GUI client, AliceIncremental = headless.
          .zst variants are ~10 MB instead of ~50 MB; decompress with: zstd -d file.zst
        files: |
          build/AliceIncremental
          build/AliceIncremental.zst
          build/Alice
          build/Alice.zst
          build/ci-report.txt
        fail_on_unmatched_files: false

  build-check:
    needs: [linux-build]
    runs-on: ubuntu-latest
    name: Build Matrix
    steps:
      - run: echo success
