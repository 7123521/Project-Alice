name: Build Matrix

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    strategy:
      matrix:
        config: [Release]
        llvm-version: [20]
        compiler: [clang]
        os: [ubuntu-latest]

    env:
      CC: clang-${{ matrix.llvm-version }}
      CXX: clang++-${{ matrix.llvm-version }}

    name: Ubuntu with ${{ matrix.compiler }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Start CI report
      run: |
        mkdir -p build
        {
          echo "commit: ${{ github.sha }}"
          echo "event: ${{ github.event_name }}"
          echo "started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo
          echo "== cpu =="; nproc; lscpu | grep -E 'Model name|^CPU\(s\):|Thread|^Core|Socket' || true
          echo "== memory =="; free -h
          echo "== disk =="; df -h / | tail -2
        } > build/ci-report.txt

    - name: Apt LLVM
      run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm-version }}
          sudo apt-get update

    - name: install Clang
      run: sudo apt install --no-install-recommends clang-${{ matrix.llvm-version }}

    - name: "Install"
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: git build-essential cmake ccache libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libicu-dev
        version: 1.0

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        variant: ccache
        key: ${{ matrix.compiler }}-${{ matrix.llvm-version }}-${{ matrix.config }}
        max-size: 2G

    - name: Configure Build Files
      run: |
        cmake -DCMAKE_BUILD_TYPE=${{ matrix.config }} -B build \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build Project Alice
      run: |
        cmake --build build --parallel --target Alice

    - name: Build Project Alice Incremental
      run: |
        cmake --build build --parallel --target AliceIncremental

    - name: Finish CI report
      run: |
        {
          echo
          echo "== ccache =="; ccache --show-stats || true
          echo
          echo "== binaries =="; ls -la build/AliceIncremental build/Alice 2>/dev/null || true
          echo "finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } >> build/ci-report.txt
        cat build/ci-report.txt

    - name: Smoke test (headless, 1 year)
      run: |
        ls -la build/AliceIncremental
        ./build/AliceIncremental --headless -years 1 -dump /tmp/smoke -seed 1234 -threads 2 | tail -3

    - name: Drop stale per-commit releases
      if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release list --limit 200 --json tagName \
          --jq '.[] | select(.tagName | startswith("build-")) | .tagName' \
          | while read -r tag; do
              echo "deleting stale release $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            done

    - name: Strip and compress binaries (smaller download)
      run: |
        for b in AliceIncremental Alice; do
          strip --strip-unneeded "build/$b" || true
          zstd -19 -T0 -q -f "build/$b" -o "build/$b.zst"
        done
        ls -la build/AliceIncremental build/AliceIncremental.zst build/Alice build/Alice.zst

    - name: Publish dev build (anonymous download)
      if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        # one rolling pre-release, overwritten on every build, so tags do not accumulate
        tag_name: dev-latest
        name: dev build (latest main)
        prerelease: true
        body: |
          Rolling Linux build of branch main @ ${{ github.sha }}
          Alice = full client, AliceIncremental = headless (for -dump experiments)
          .zst variants are ~10 MB instead of ~45 MB; decompress with: zstd -d file.zst
          This is a fork-local development build, not an upstream release.
        files: |
          build/AliceIncremental
          build/AliceIncremental.zst
          build/Alice
          build/Alice.zst
          build/ci-report.txt
        fail_on_unmatched_files: true

    - name: Upload Linux binaries
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: alice-linux-${{ github.sha }}
        path: |
          build/AliceIncremental
          build/Alice
        if-no-files-found: error
        retention-days: 30

  build-check:
    needs: [linux-build]
    runs-on: ubuntu-latest
    name: Build Matrix
    steps:
      - name: Check
        run: |
          echo success
